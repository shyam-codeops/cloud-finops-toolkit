[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-finops-toolkit"
version = "1.0.0"
authors = [
  { name="Shyam Singh", email="shyam.s.ops@gmail.com" },
]
description = "Automated Cloud Cost Optimization, VM Rightsizing, and Waste Elimination Toolkit"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
finops-toolkit = "finops_toolkit.cli:main"
